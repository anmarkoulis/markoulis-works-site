<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">
  <title>{{ page.title | default: site.title }}</title>
</head>
<body>
  {% if page.lang == 'el' %}
    {% include header_gr.html %}
  {% else %}
    {% include header_en.html %}
  {% endif %}
  <main>
    {{ content }}
  </main>
  {% if page.lang == 'el' %}
    {% include footer_gr.html %}
  {% else %}
    {% include footer_en.html %}
  {% endif %}
  <script src="{{ site.baseurl }}/cookie-consent.js" defer></script>
</body>
</html>
